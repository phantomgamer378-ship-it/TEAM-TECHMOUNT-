# Pilot config — pipeline validation only (synthetic random-noise WAVs)
device: auto
sample_rate: 16000
num_samples: 64600

training:
  batch_size: 4
  epochs: 2
  learning_rate: 1.0e-5
  weight_decay: 1.0e-4
  optimizer: adam
  early_stopping_patience: 2
  fine_tuning_mode: full

augmentation:
  enabled: false

splits_dir: data/splits

checkpoints:
  dir: checkpoints/experiment_001
  save_best: true
  save_last: true

data:
  manifest: data/manifests/pilot_manifest.csv
  samples_dir: data/samples
  languages: [hi, mr]
  target_count_per_class: 20

seed: 42
