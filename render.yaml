databases:
  - name: vanirakshak-db
    databaseName: vanirakshak
    user: postgres

services:
  - type: web
    name: vanirakshak-backend
    env: docker
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vanirakshak-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
