databases:
  - name: vanirakshak-db
    databaseName: vanirakshak
    user: postgres

services:
  - type: web
    name: vanirakshak-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt && pip install uvicorn sqlalchemy asyncpg psycopg2-binary PyJWT"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port 10000"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vanirakshak-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 10000
